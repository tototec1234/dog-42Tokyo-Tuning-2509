worker_processes auto;
worker_rlimit_nofile 65535;
worker_cpu_affinity auto;
events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 30;
    client_header_timeout 30;
    send_timeout 30;
    
    # Enhanced caching
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=imgcache:200m inactive=24h max_size=2g;
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=apicache:100m inactive=1h max_size=1g;
    proxy_headers_hash_max_size 2048;
    proxy_headers_hash_bucket_size 256;
    
    # File cache optimization
    open_file_cache max=20000 inactive=120s;
    open_file_cache_valid 240s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;
    
    # Enhanced gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/x-javascript application/javascript;
    gzip_vary on;
    gzip_proxied any;
    
    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Buffer optimization
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    upstream frontend {
        server frontend:3000;
        keepalive 128;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream backend {
        server backend:8080;
        keepalive 128;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    
    upstream jaeger {
        server jaeger:16686;
        keepalive 32;
    }

    # Serve images directly from shared volume via internal rewrite
    # Request form: /api/v1/image?path=relative/path/to/file
    # We rewrite to /_img/<path> which is aliased to /app/images/

    server {
        listen 443 ssl http2;

        ssl_certificate /da/tls/fullchain.pem;
        ssl_certificate_key /da/tls/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_prefer_server_ciphers on;

        location /jaeger/ {
            proxy_pass         http://jaeger;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Cache aggressively for Next.js build assets
        location ^~ /_next/static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Cache responsive images moderately
        location /_next/image {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Health check endpoint - no caching
        location = /api/health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;
        }
        
        # Robot API endpoints - no caching for real-time data
        location ^~ /api/robot {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;
        }
        
        # All other API endpoints
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            
            # Enable caching for GET requests to product listings
            proxy_cache apicache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Image endpoint caching: reduce backend load heavily
        # Internal static image location
        location ^~ /_img/ {
            alias /app/images/;
            expires 1d;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        }

        # Public endpoint rewriting to internal static path
        location = /api/v1/image {
            if ($arg_path = "") { return 400; }
            rewrite ^ /_img/$arg_path last;
        }
    }

    server {
        listen 80;

        return 301 https://$host$request_uri;
    }
}
