worker_processes auto;
events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    # Cache for backend-served images
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=imgcache:100m inactive=24h max_size=1g;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    upstream frontend {
        server frontend:3000;
        keepalive 64;
    }

    upstream backend {
        server backend:8080;
        keepalive 64;
    }
    
    upstream jaeger {
        server jaeger:16686;
        keepalive 16;
    }

    # Serve images directly from shared volume via internal rewrite
    # Request form: /api/v1/image?path=relative/path/to/file
    # We rewrite to /_img/<path> which is aliased to /app/images/
    server {
        listen 0; # dummy block to define shared locations if needed
    }

    server {
        listen 443 ssl http2;

        ssl_certificate /da/tls/fullchain.pem;
        ssl_certificate_key /da/tls/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_prefer_server_ciphers on;

        location /jaeger/ {
            proxy_pass         http://jaeger;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Cache aggressively for Next.js build assets
        location ^~ /_next/static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Cache responsive images moderately
        location /_next/image {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Image endpoint caching: reduce backend load heavily
        # Internal static image location
        location ^~ /_img/ {
            alias /app/images/;
            expires 1d;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        }

        # Public endpoint rewriting to internal static path
        location = /api/v1/image {
            if ($arg_path = "") { return 400; }
            rewrite ^ /_img/$arg_path last;
        }
    }

    server {
        listen 80;

        return 301 https://$host$request_uri;
    }
}
